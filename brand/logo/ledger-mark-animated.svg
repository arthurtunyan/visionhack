<svg xmlns="http://www.w3.org/2000/svg" class="ledger-anim" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Ledger">
  <title>Ledger</title>
  <style>
  .ledger-anim .bl,.ledger-anim .br{animation:lg-bl 3s cubic-bezier(.22,.68,.28,1) infinite}
  .ledger-anim .br{animation-name:lg-br}
  .ledger-anim .row{transform-origin:22px center;animation:lg-row 3s cubic-bezier(.22,.68,.28,1) infinite}
  .ledger-anim .r2{animation-delay:.12s}.ledger-anim .r3{animation-delay:.24s}
  @keyframes lg-bl{0%{transform:translateX(-14px);opacity:0}14%,86%{transform:translateX(0);opacity:1}100%{transform:translateX(-14px);opacity:0}}
  @keyframes lg-br{0%{transform:translateX(14px);opacity:0}14%,86%{transform:translateX(0);opacity:1}100%{transform:translateX(14px);opacity:0}}
  @keyframes lg-row{0%,12%{transform:scaleX(0)}30%,86%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.ledger-anim .bl,.ledger-anim .br,.ledger-anim .row{animation:none}}
  </style>
  <path class="bl" d="M22 14 H12 V50 H22" fill="none" stroke="#1B4DFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="br" d="M42 14 H52 V50 H42" fill="none" stroke="#1B4DFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="row r1" x="22" y="23" width="20" height="4.6" rx="2.3" fill="#000000"/>
  <rect class="row r2" x="22" y="30.2" width="13" height="4.6" rx="2.3" fill="#000000" opacity=".38"/>
  <rect class="row r3" x="22" y="37.4" width="16" height="4.6" rx="2.3" fill="#000000"/>
</svg>
